name: Build QR Wallet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created at $APK"
            echo "APK files found:"
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi
          echo "APK details:"
          ls -lh "$APK"
          file "$APK"
          unzip -t "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Wallet-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: QR Wallet APK
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
